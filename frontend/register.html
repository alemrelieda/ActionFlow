<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ActionFlow - Register</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <h1>
                ActionFlow
            </h1>

            <p class="subtitle">
                Meeting Decision & Follow-up Management System
            </p>

            <h2>
                Register
            </h2>

            <form id="registerForm">

                <div class="form-group">

                    <label for="registerFullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerFullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Enter your password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="registerConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="registerConfirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-button"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
